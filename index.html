<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Slouvre</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

:root{
  --wall:#D9D6CD;
  --wall-lit:#E4E1D9;
  --ink:#000000;
  --oxblood:#6B1E22;
  --brass:#7E6A2E;
  --label:#FBFAF7;
  --sold:#C0221F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--wall);
  background-image:radial-gradient(120% 70% at 50% 0%, var(--wall-lit) 0%, var(--wall) 62%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

/* ---------- top ---------- */
header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding:18px 20px 14px;
  border-bottom:1px solid rgba(0,0,0,.35);
}
.mark{
  font-family:'Bodoni Moda',serif;
  font-weight:600;
  font-size:20px;
  letter-spacing:.20em;
  text-transform:uppercase;
  line-height:1;
}
.mark small{
  display:block;
  font-family:'EB Garamond',serif;
  font-weight:400;font-size:11.5px;letter-spacing:.06em;
  text-transform:none;font-style:italic;
  opacity:.62;margin-top:5px;
}
.lang{display:flex;gap:0;border:1px solid rgba(0,0,0,.4)}
.lang button{
  font-family:'EB Garamond',serif;font-size:13px;
  background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--ink);
}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--wall-lit)}
.lang button:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}

/* ---------- gallery ---------- */
main{padding:34px 20px 10px;max-width:760px;margin:0 auto}

.hang{display:flex;flex-direction:column;align-items:center}

.frame{
  background:#111;
  padding:13px;
  border:1px solid #000;
  box-shadow:0 22px 34px -20px rgba(0,0,0,.75), 0 3px 6px rgba(0,0,0,.28);
  width:100%;max-width:430px;
}
.mat{background:#fff;padding:16px}
.canvas{display:block;width:100%;height:auto;background:#fff}

/* wall label */
.placard{
  background:var(--label);
  border:1px solid rgba(0,0,0,.22);
  box-shadow:0 1px 2px rgba(0,0,0,.16);
  padding:15px 17px 16px;
  margin:26px 0 0;
  width:100%;max-width:430px;
  position:relative;
}
.dot{
  position:absolute;top:15px;right:15px;
  width:11px;height:11px;border-radius:50%;
  background:var(--sold);
  opacity:0;transform:scale(.4);
  transition:opacity .32s ease,transform .32s cubic-bezier(.2,1.4,.4,1);
}
.placard.acquired .dot{opacity:1;transform:scale(1)}

.p-artist{font-variant:small-caps;letter-spacing:.06em;font-size:15px;line-height:1.25}
.p-title{
  font-family:'Bodoni Moda',serif;
  font-style:italic;font-size:21px;line-height:1.2;margin:3px 0 1px;
  padding-right:16px;
}
.p-meta{font-size:14.5px;opacity:.72;line-height:1.4}
.p-stmt{
  font-size:15px;line-height:1.5;margin-top:11px;
  padding-top:11px;border-top:1px solid rgba(0,0,0,.16);
}
.p-foot{
  display:flex;justify-content:space-between;gap:10px;
  margin-top:11px;font-size:13.5px;
}
.p-val{color:var(--brass);font-variant:small-caps;letter-spacing:.05em}
.p-status{font-style:italic;opacity:.66;text-align:right}

/* ---------- rarity: the frame does the talking ---------- */
.wall{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.frame.t1{background:#9C8358;padding:8px;box-shadow:0 10px 18px -14px rgba(0,0,0,.6)}
.frame.t2{background:#141414;padding:13px}
.frame.t3{background:#080808;padding:20px;box-shadow:0 26px 40px -22px rgba(0,0,0,.8),0 3px 7px rgba(0,0,0,.3)}
.frame.t4,.frame.t5,.frame.t6{
  background:linear-gradient(150deg,#8A6E22 0%,#E3C86A 22%,#A8842C 48%,#F0DC9A 68%,#8A6E22 100%);
  border:1px solid #4E3D10;padding:18px;
  box-shadow:0 26px 42px -22px rgba(0,0,0,.8),0 3px 8px rgba(0,0,0,.35);
}
.frame.t5{padding:22px}
.frame.t6{padding:26px;outline:3px double #6B5518;outline-offset:5px}
.frame.t4 .mat,.frame.t5 .mat,.frame.t6 .mat{box-shadow:inset 0 0 0 2px #4E3D10}

.plight{display:none}
.frame-wrap{position:relative;width:100%;display:flex;justify-content:center}
.lit .plight{
  display:block;position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  width:44%;height:26px;pointer-events:none;
}
.lit .plight::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:74px;height:7px;border-radius:3px;
  background:linear-gradient(#E3C86A,#8A6E22);border:1px solid #4E3D10;
}
.lit .plight::after{
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:100%;height:120px;
  background:radial-gradient(60% 100% at 50% 0%, rgba(255,246,214,.62), rgba(255,246,214,0) 72%);
}
.rope{margin-top:14px;opacity:.9}
.rope.hide{display:none}

/* ---------- object file ---------- */
.file{
  width:100%;max-width:430px;margin:16px 0 0;
  border-top:1px solid rgba(0,0,0,.3);padding-top:11px;
}
.file-h{font-variant:small-caps;letter-spacing:.07em;font-size:13.5px;opacity:.62;margin-bottom:5px}
.row{display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px dotted rgba(0,0,0,.18);font-size:14.5px}
.row:last-child{border-bottom:0}
.row b{font-weight:400;font-variant:small-caps;letter-spacing:.05em;opacity:.58;flex:none;width:104px}
.row i{font-style:normal;flex:1}
.row u{text-decoration:none;color:var(--brass);font-variant:small-caps;flex:none;width:50px;text-align:right}
.row.key i{font-style:italic}

.p-tier{
  font-variant:small-caps;letter-spacing:.09em;font-size:13px;
  color:var(--oxblood);margin-bottom:5px;padding-right:16px;
}

/* ---------- actions ---------- */
.acts{display:flex;gap:9px;margin:22px 0 6px;width:100%;max-width:430px}
.acts button{
  flex:1;font-family:'EB Garamond',serif;font-size:15.5px;
  padding:11px 8px;cursor:pointer;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  transition:background .16s ease,color .16s ease;
}
.acts button:hover{background:var(--ink);color:var(--wall-lit)}
.acts .buy{background:var(--oxblood);border-color:var(--oxblood);color:#F3EFE6}
.acts .buy:hover{background:#000;border-color:#000}
.acts button:disabled{opacity:.34;cursor:default}
.acts button:disabled:hover{background:transparent;color:var(--ink)}
.acts button:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}

.note{
  max-width:430px;font-size:13.5px;font-style:italic;opacity:.6;
  text-align:center;margin:2px auto 0;
}

/* ---------- commission desk ---------- */
.desk{
  width:100%;max-width:430px;margin:30px auto 0;
  border-top:1px solid rgba(0,0,0,.3);padding-top:14px;
}
.desk-h{font-variant:small-caps;letter-spacing:.07em;font-size:13.5px;opacity:.62;margin-bottom:3px}
.desk-p{font-size:14.5px;opacity:.72;font-style:italic;margin:0 0 9px;line-height:1.4}
.desk-row{display:flex;gap:8px}
.desk input{
  flex:1;min-width:0;font-family:'EB Garamond',serif;font-size:16px;
  padding:9px 11px;border:1px solid rgba(0,0,0,.45);background:var(--label);color:var(--ink);
}
.desk input:focus{outline:2px solid var(--oxblood);outline-offset:1px}
.desk button{
  font-family:'EB Garamond',serif;font-size:15px;padding:9px 14px;cursor:pointer;
  border:1px solid var(--oxblood);background:var(--oxblood);color:#F3EFE6;flex:none;
}
.desk button:hover{background:#000;border-color:#000}
.desk button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seedline{
  font-size:13px;opacity:.55;margin-top:8px;font-style:italic;min-height:1.3em;
}

/* ---------- curator ---------- */
.curator{
  max-width:430px;margin:44px auto 0;padding-top:22px;
  border-top:1px solid rgba(0,0,0,.3);
  display:flex;gap:15px;align-items:flex-start;
}
.curator svg{width:92px;flex:none}
.c-name{font-variant:small-caps;letter-spacing:.06em;font-size:15px}
.c-role{font-size:13.5px;opacity:.65;font-style:italic;margin-bottom:7px}
.c-quote{font-size:15px;line-height:1.45}

/* ---------- donors ---------- */
.donors{
  margin-top:40px;border-top:1px solid rgba(0,0,0,.3);
  overflow:hidden;padding:9px 0 12px;
}
.donors-in{
  display:inline-block;white-space:nowrap;
  font-variant:small-caps;letter-spacing:.07em;font-size:13px;color:var(--oxblood);
  animation:scroll 64s linear infinite;
}
.donors-in span{padding:0 22px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

footer{
  max-width:760px;margin:0 auto;padding:0 20px 40px;
  font-size:13px;opacity:.55;display:flex;justify-content:space-between;gap:12px;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:640px){
  main{padding-top:48px}
  .mark{font-size:25px}
  .frame{max-width:470px}
  .placard,.acts,.note,.curator{max-width:470px}
}
</style>

<style>
#intro{
  position:fixed;inset:0;z-index:90;
  background:#171310;
  display:flex;flex-direction:column;
  overflow:hidden;
}
#intro.gone{display:none}
.doors{position:absolute;inset:0;z-index:1;pointer-events:none}
.door{
  position:absolute;top:0;bottom:0;width:50.6%;
  background:linear-gradient(100deg,#3A2A1C,#241A11 40%,#4A3624 70%,#2A1E14);
  transition:transform 2.1s cubic-bezier(.7,0,.3,1);
}
.door::after{
  content:"";position:absolute;top:8%;bottom:8%;left:12%;right:12%;
  border:2px solid rgba(227,200,106,.28);
}
.door.l{left:0;transform:translateX(-101%)}
.door.r{right:0;transform:translateX(101%)}
#intro.shut .door.l,#intro.shut .door.r{transform:translateX(0)}
#intro.opening .stage,#intro.opening .tap{opacity:0;transition:opacity 1.1s ease}
#intro.opening .door.l{transform:translateX(-101%)}
#intro.opening .door.r{transform:translateX(101%)}

.stage{
  position:relative;z-index:3;flex:1;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:16px;padding:26px 22px;max-width:520px;margin:0 auto;width:100%;
  text-align:center;
}
.tstage{width:118px;flex:none}
.tstage .blink{animation:blink 6.5s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.08)}}
.tstage g.body{animation:bob 7s ease-in-out infinite;transform-origin:60px 140px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(.5deg)}}

.beat{
  font-family:'EB Garamond',Georgia,serif;
  color:#EDE4D2;font-size:19px;line-height:1.5;
  max-width:30em;min-height:4.6em;
  opacity:0;transform:translateY(9px);
  transition:opacity .75s ease,transform .75s ease;
}
.beat.on{opacity:1;transform:none}
.vig{
  height:118px;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease;
}
.vig.on{opacity:1;transform:none}
.vig svg{height:100%;width:auto}

.ictl{
  position:absolute;z-index:6;display:flex;gap:10px;align-items:center;
}
.ictl.tl{top:14px;left:16px}
.ictl.tr{top:14px;right:16px}
.ictl button{
  font-family:'EB Garamond',serif;font-size:13.5px;
  background:none;border:1px solid rgba(237,228,210,.36);color:#EDE4D2;
  padding:5px 11px;cursor:pointer;letter-spacing:.05em;
}
#iSkip{border-color:rgba(237,228,210,.85);background:rgba(237,228,210,.12);font-size:14.5px;padding:7px 15px}
#iSkip:hover{background:#EDE4D2;color:#171310}
.ictl button:hover{background:rgba(237,228,210,.13)}
.ictl button[aria-pressed="true"]{background:#EDE4D2;color:#171310}
.ictl button:focus-visible{outline:2px solid #E3C86A;outline-offset:2px}

.tap{
  position:absolute;bottom:20px;left:0;right:0;z-index:5;text-align:center;
  font-family:'EB Garamond',serif;font-size:13px;color:rgba(237,228,210,.5);
  font-style:italic;pointer-events:none;
}
#sound{
  position:fixed;bottom:14px;right:14px;z-index:40;
  font-family:'EB Garamond',serif;font-size:13px;
  background:var(--label);border:1px solid rgba(0,0,0,.3);color:var(--ink);
  padding:5px 10px;cursor:pointer;display:none;
}
#sound.show{display:block}
@media (prefers-reduced-motion:reduce){
  .door{transition:none}
  .beat,.vig{transition:none}
  .tstage .blink,.tstage g.body{animation:none}
}
@media (max-width:420px){
  .beat{font-size:17.5px}
  .tstage{width:96px}
  .vig{height:96px}
}
</style>

<main>

<script>

/* ============ the slop engine, v2 ============ */
/* procedural SVG. no model, no API, no cost per image. */

const BAD=['#C9A227','#8E4FA8','#5FA83E','#E0417A','#25A7B0','#E2711D','#3F52C4','#C43A3A','#7BC043','#F2C511','#FF5EA8','#00C2A8','#9B5DE5','#F15BB5'];
const BG=['#F0E6D2','#D8E6E0','#EFD9E6','#DCE6F2','#F5E3CE','#E6E6DC','#F2D9D9','#1A1A22','#2B1F3A','#E8F0C8'];
const SKIN=['#F2D2B6','#E0B08A','#C98C63','#8D5A3B','#B4E07A','#D9A8E0','#EDEDED'];
const GIBBER=['GALERIE','MUSSEUM','ARTT','EXHIBTION','ORIGNAL','MASTERPEICE','SGNATURE','COLLECTON','ARTISTE','LIMITEDD','AUTHENTC','PAINTNG','SLOUVER','SLOVRE','THE SLOURVE','SLOUVRE'];

/* one generator, three inputs: a free roll, a description, a photograph.
   each one only has to produce a seed. */
let RNG=Math.random, FORCE=null, SEED=null, PAL=null, WOB=1, DENS=1;
let CW=300, CH=300, BANNER=false, SPECIES=null, ACC=null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
function norm(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const P=a=>a[Math.floor(RNG()*a.length)];
const chance=p=>RNG()<p;

function readWords(t){
  const n=' '+norm(t)+' ',f={};
  LEX.forEach(([re,set])=>{ if(re.test(n)) Object.keys(set).forEach(k=>{ if(!f[k]) f[k]=set[k]; }); });
  /* every word does something, listed or not: the letters themselves
     set how badly the piece is drawn and how crowded it gets. */
  const s=norm(t)||' ';
  const vow=(s.match(/[aeiou]/g)||[]).length/Math.max(s.length,1);
  const uniq=new Set(s.replace(/ /g,'')).size;
  f.wob=0.55+vow*2.4+(uniq%5)*0.11;
  f.dens=0.6+Math.min(s.length,90)/60;
  return f;
}
const F=n=>n.toFixed(1);

let HANDS=0;
function wobble(pts,amt){return pts.map(p=>[p[0]+R(-amt,amt),p[1]+R(-amt,amt)]);}

function blob(cx,cy,r,n,amt){ amt*=WOB;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, rr=r*R(.7,1.32);
    pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*R(.78,1.28)]);
  }
  const w=wobble(pts,amt);
  let d=`M${F(w[0][0])} ${F(w[0][1])}`;
  for(let i=1;i<=w.length;i++){
    const a=w[i%w.length],b=w[(i+1)%w.length];
    d+=` Q${F(a[0])} ${F(a[1])} ${F((a[0]+b[0])/2)} ${F((a[1]+b[1])/2)}`;
  }
  return d+'Z';
}
function scrawl(x,y,len,segs){
  let d=`M${F(x)} ${F(y)}`,cx=x,cy=y;
  for(let i=0;i<segs;i++){
    const nx=cx+R(-len,len),ny=cy+R(-len,len);
    d+=` Q${F(cx+R(-len,len))} ${F(cy+R(-len,len))} ${F(nx)} ${F(ny)}`;
    cx=nx;cy=ny;
  }
  return d;
}
function ink(s){return `fill="none" stroke="#111" stroke-width="${F(s)}" stroke-linecap="round" stroke-linejoin="round"`;}

const ACCS=[['none',.40],['glasses',.12],['sunglasses',.09],['cap',.09],['beanie',.05],

function pickAcc(){let r=R(0,1);for(const[k,w]of ACCS){if((r-=w)<=0)return k;}return 'none';}

function headAcc(kind,cx,cy,hr,s){
  const sw=R(2,3.4)*s;let g='';
  const O=`fill="none" stroke="#111" stroke-width="${F(sw)}" stroke-linecap="round" stroke-linejoin="round"`;
  if(kind==='glasses'){
    const r=hr*.3;
    g+=`<circle cx="${F(cx-hr*.38)}" cy="${F(cy)}" r="${F(r)}" fill="#DCEBF2" fill-opacity=".45" stroke="#111" stroke-width="${F(sw)}"/>`;
    g+=`<circle cx="${F(cx+hr*.38)}" cy="${F(cy-hr*.05)}" r="${F(r*R(.8,1.15))}" fill="#DCEBF2" fill-opacity=".45" stroke="#111" stroke-width="${F(sw)}"/>`;
    g+=`<path d="M${F(cx-hr*.09)} ${F(cy)} h${F(hr*.2)}" ${O}/>`;
    g+=`<path d="M${F(cx-hr*.68)} ${F(cy-hr*.06)} l${F(-hr*.28)} ${F(-hr*.1)}" ${O}/>`;
  }else if(kind==='sunglasses'){
    g+=`<path d="M${F(cx-hr*.72)} ${F(cy-hr*.16)} h${F(hr*1.44)} v${F(hr*.1)} q${F(-hr*.06)} ${F(hr*.42)} ${F(-hr*.5)} ${F(hr*.38)} q${F(-hr*.2)} ${F(-hr*.06)} ${F(-hr*.22)} ${F(-hr*.3)} q${F(-hr*.02)} ${F(hr*.26)} ${F(-hr*.24)} ${F(hr*.3)} q${F(-hr*.44)} ${F(.04*hr)} ${F(-hr*.48)} ${F(-hr*.38)} Z" fill="#141414" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;
    g+=`<path d="M${F(cx-hr*.72)} ${F(cy-hr*.12)} l${F(-hr*.26)} ${F(-hr*.12)} M${F(cx+hr*.72)} ${F(cy-hr*.12)} l${F(hr*.26)} ${F(-hr*.12)}" ${O}/>`;
    g+=`<path d="M${F(cx-hr*.58)} ${F(cy-hr*.04)} l${F(hr*.16)} ${F(hr*.16)}" stroke="#fff" stroke-width="${F(sw*.8)}" opacity=".55"/>`;
  }else if(kind==='monocle'){
    g+=`<circle cx="${F(cx+hr*.36)}" cy="${F(cy-hr*.04)}" r="${F(hr*.34)}" fill="#DCEBF2" fill-opacity=".4" stroke="#C9A227" stroke-width="${F(sw*1.2)}"/>`;
    g+=`<path d="M${F(cx+hr*.66)} ${F(cy+hr*.16)} q${F(hr*.3)} ${F(hr*.5)} ${F(-hr*.1)} ${F(hr*.9)}" fill="none" stroke="#C9A227" stroke-width="${F(sw*.7)}"/>`;
  }else if(kind==='cap'){
    const c=P(PAL);
    g+=`<path d="M${F(cx-hr*.9)} ${F(cy-hr*.42)} q${F(hr*.9)} ${F(-hr*1.05)} ${F(hr*1.8)} 0 Z" fill="${c}" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;
    g+=`<path d="M${F(cx+hr*.6)} ${F(cy-hr*.44)} q${F(hr*.85)} ${F(-hr*.06)} ${F(hr*.8)} ${F(hr*.22)} q${F(-hr*.5)} ${F(hr*.16)} ${F(-hr*.86)} ${F(hr*.04)} Z" fill="${c}" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;
    g+=`<circle cx="${F(cx)}" cy="${F(cy-hr*.98)}" r="${F(hr*.09)}" fill="${c}" stroke="#111" stroke-width="${F(sw*.6)}"/>`;
  }else if(kind==='beanie'){
    const c=P(PAL);
    g+=`<path d="M${F(cx-hr*.92)} ${F(cy-hr*.36)} q${F(hr*.92)} ${F(-hr*1.15)} ${F(hr*1.84)} 0 Z" fill="${c}" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;
    g+=`<rect x="${F(cx-hr*.95)}" y="${F(cy-hr*.46)}" width="${F(hr*1.9)}" height="${F(hr*.26)}" fill="${c}" stroke="#111" stroke-width="${F(sw)}"/>`;
    g+=`<circle cx="${F(cx+R(-6,6)*s)}" cy="${F(cy-hr*1.14)}" r="${F(hr*.2)}" fill="${c}" stroke="#111" stroke-width="${F(sw*.7)}"/>`;
  }else if(kind==='beret'){
    g+=`<ellipse cx="${F(cx-hr*.1)}" cy="${F(cy-hr*.7)}" rx="${F(hr*.95)}" ry="${F(hr*.34)}" fill="#1E1E1E" stroke="#111" stroke-width="${F(sw)}" transform="rotate(-11 ${F(cx)} ${F(cy-hr*.7)})"/>`;
    g+=`<circle cx="${F(cx-hr*.5)}" cy="${F(cy-hr*.95)}" r="${F(hr*.11)}" fill="#1E1E1E" stroke="#111" stroke-width="${F(sw*.6)}"/>`;
  }else if(kind==='crown'){
    let d=`M${F(cx-hr*.72)} ${F(cy-hr*.5)}`;
    for(let i=0;i<4;i++){d+=` L${F(cx-hr*.72+i*hr*.48+hr*.24)} ${F(cy-hr*R(.95,1.2))} L${F(cx-hr*.72+(i+1)*hr*.48)} ${F(cy-hr*.5)}`;}
    g+=`<path d="${d} Z" fill="#E3C86A" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;

}
function mouthAcc(kind,cx,my,hr,s){
  const sw=R(2,3)*s;let g='';
  if(kind==='cigarette'){
    g+=`<rect x="${F(cx+hr*.24)}" y="${F(my-hr*.06)}" width="${F(hr*.62)}" height="${F(hr*.13)}" fill="#F3EFE4" stroke="#111" stroke-width="${F(sw*.7)}" transform="rotate(9 ${F(cx)} ${F(my)})"/>`;
    g+=`<rect x="${F(cx+hr*.78)}" y="${F(my-hr*.06)}" width="${F(hr*.1)}" height="${F(hr*.13)}" fill="#C4523A" transform="rotate(9 ${F(cx)} ${F(my)})"/>`;
    g+=`<path d="${scrawl(cx+hr*.95,my-hr*.2,hr*.22,4)}" fill="none" stroke="#9AA0A6" stroke-width="${F(sw*.8)}" opacity=".75" stroke-linecap="round"/>`;
  }else if(kind==='cigar'){
    g+=`<rect x="${F(cx+hr*.22)}" y="${F(my-hr*.12)}" width="${F(hr*.78)}" height="${F(hr*.24)}" rx="${F(hr*.1)}" fill="#6B4A28" stroke="#111" stroke-width="${F(sw*.7)}" transform="rotate(7 ${F(cx)} ${F(my)})"/>`;
    g+=`<rect x="${F(cx+hr*.36)}" y="${F(my-hr*.12)}" width="${F(hr*.14)}" height="${F(hr*.24)}" fill="#C9A227" transform="rotate(7 ${F(cx)} ${F(my)})"/>`;
    g+=`<path d="${scrawl(cx+hr*1.1,my-hr*.26,hr*.3,5)}" fill="none" stroke="#9AA0A6" stroke-width="${F(sw*1.1)}" opacity=".8" stroke-linecap="round"/>`;
  }
  return g;
}
function bodyAcc(kind,cx,by,s){
  const sw=R(2.2,3.6)*s;let g='';
  const O=`stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round" stroke-linecap="round"`;
  if(kind==='trench'){
    g+=`<path d="M${F(cx-30*s)} ${F(by+4*s)} L${F(cx+30*s)} ${F(by+4*s)} L${F(cx+26*s)} ${F(by+82*s)} L${F(cx-26*s)} ${F(by+82*s)} Z" fill="#C0A878" ${O}/>`;
    g+=`<path d="M${F(cx)} ${F(by+4*s)} v${F(78*s)}" ${O} fill="none"/>`;
    g+=`<path d="M${F(cx-30*s)} ${F(by+40*s)} h${F(60*s)}" stroke="#8A7333" stroke-width="${F(sw*2)}"/>`;
    g+=`<circle cx="${F(cx-9*s)}" cy="${F(by+20*s)}" r="${F(3*s)}" fill="#111"/>`;
  }else if(kind==='jersey'){
    const c1=P(PAL);
    g+=`<path d="M${F(cx-28*s)} ${F(by+4*s)} L${F(cx+28*s)} ${F(by+4*s)} L${F(cx+24*s)} ${F(by+66*s)} L${F(cx-24*s)} ${F(by+66*s)} Z" fill="${c1}" ${O}/>`;
    g+=`<text x="${F(cx)}" y="${F(by+46*s)}" font-family="Georgia,serif" font-size="${F(30*s)}" text-anchor="middle" fill="#F5F0E4" stroke="#111" stroke-width="${F(sw*.4)}">${RI(0,9)}${RI(0,9)}</text>`;
  }else if(kind==='rocker'){
    g+=`<path d="M${F(cx-29*s)} ${F(by+4*s)} L${F(cx+29*s)} ${F(by+4*s)} L${F(cx+25*s)} ${F(by+70*s)} L${F(cx-25*s)} ${F(by+70*s)} Z" fill="#1C1C1C" ${O}/>`;
    g+=`<path d="M${F(cx-14*s)} ${F(by+4*s)} l${F(8*s)} ${F(22*s)} l${F(-10*s)} ${F(6*s)} Z M${F(cx+14*s)} ${F(by+4*s)} l${F(-8*s)} ${F(22*s)} l${F(10*s)} ${F(6*s)} Z" fill="#2E2E2E" ${O}/>`;
    for(let i=0;i<RI(3,7);i++)
      g+=`<circle cx="${F(cx+R(-22,22)*s)}" cy="${F(by+R(14,60)*s)}" r="${F(2.2*s)}" fill="#C9C9C9"/>`;
  }
  return g;
}
function applyAcc(kind,cx,cy,hr,s,by){
  if(!kind||kind==='none')return '';
  let g='';
  g+=headAcc(kind,cx,cy,hr,s);
  g+=mouthAcc(kind,cx,cy+hr*.45,hr,s);
  if(by!==undefined)g+=bodyAcc(kind,cx,by,s);
  return g;
}

/* wrong eyes — the house style */
function eyes(cx,cy,r,s){
  let g='';
  const e=[[cx-r*R(.28,.58),cy-r*R(0,.3)],[cx+r*R(.14,.52),cy-r*R(-.16,.34)]];
  e.forEach(p=>{
    const k=R(.12,.44);
    if(chance(.36)){
      g+=`<ellipse cx="${F(p[0])}" cy="${F(p[1])}" rx="${F(r*k)}" ry="${F(r*k*R(.4,1.6))}" fill="#111"/>`;
    }else{
      g+=`<ellipse cx="${F(p[0])}" cy="${F(p[1])}" rx="${F(r*k)}" ry="${F(r*k*R(.5,1.3))}" fill="#fff" ${chance(.5)?`stroke="#111" stroke-width="${F(s*.7)}"`:''}/>`;
      g+=`<circle cx="${F(p[0]+R(-5,5))}" cy="${F(p[1]+R(-4,4))}" r="${F(r*k*.4)}" fill="#111"/>`;
    }
  });
  return g;
}
function mouth(cx,cy,r,s){
  const w=r*R(.35,1.0);
  if(chance(.3)){
    return `<path d="${blob(cx,cy,r*R(.15,.3),6,3)}" fill="#8E2B2B" ${chance(.5)?`stroke="#111" stroke-width="${F(s*.7)}"`:''}/>`;
  }
  return `<path d="M${F(cx-w/2)} ${F(cy)} Q${F(cx+R(-16,16))} ${F(cy+r*R(.15,.6))} ${F(cx+w/2)} ${F(cy+R(-8,8))}" ${ink(s)}/>`;
}
function drip(x,y,len,col,w){
  return `<path d="M${F(x)} ${F(y)} q${F(R(-4,4))} ${F(len*.5)} ${F(R(-6,6))} ${F(len)}" fill="none" stroke="${col}" stroke-width="${F(w)}" stroke-linecap="round" opacity="${F(R(.5,.95))}"/>`;
}

function subjBrainlet(cx,cy,s){
  let g='';const sw=R(2.4,4.6)*s;let hr=36*s;
  const sp=(()=>{const r=R(0,1);
    if(r<.055)return 'alien'; if(r<.105)return 'zombie'; return 'human';})();
  SPECIES=SPECIES||sp;
  let skin=P(SKIN);
  if(sp==='alien'){skin=P(['#9BD46A','#8FD1C0','#C7E86A']);hr*=1.22;}
  if(sp==='zombie')skin=P(['#8FA36B','#9AA88C','#7E9160']);

  g+=`<path d="${blob(cx,cy,hr,RI(6,9),4*s)}" fill="${skin}" stroke="#111" stroke-width="${F(sw)}" stroke-linejoin="round"/>`;
  if(sp==='alien'){
    for(let a=0;a<2;a++){const dir=a?1:-1;
      g+=`<path d="M${F(cx+dir*hr*.45)} ${F(cy-hr*.8)} q${F(dir*10*s)} ${F(-26*s)} ${F(dir*2*s)} ${F(-36*s)}" ${ink(sw*.9)}/>`;
      g+=`<circle cx="${F(cx+dir*hr*.5)}" cy="${F(cy-hr*.8-36*s)}" r="${F(5*s)}" fill="${skin}" stroke="#111" stroke-width="${F(sw*.7)}"/>`;}
    for(let e=0;e<2;e++){const dir=e?1:-1;
      g+=`<ellipse cx="${F(cx+dir*hr*.36)}" cy="${F(cy+hr*.05)}" rx="${F(hr*.28)}" ry="${F(hr*.4)}" fill="#111" transform="rotate(${F(dir*18)} ${F(cx+dir*hr*.36)} ${F(cy)})"/>`;}
  }else{
    g+=eyes(cx,cy,hr,sw);
  }
  if(sp==='zombie'){
    g+=`<path d="M${F(cx-hr*.5)} ${F(cy-hr*.55)} l${F(hr*.3)} ${F(hr*.12)}" ${ink(sw*.8)}/>`;
    for(let i=0;i<3;i++)g+=`<path d="M${F(cx-hr*.46+i*hr*.12)} ${F(cy-hr*.62)} l0 ${F(hr*.2)}" ${ink(sw*.6)}/>`;
    g+=`<path d="M${F(cx+hr*.3)} ${F(cy+hr*.18)} q${F(4*s)} ${F(18*s)} ${F(-2*s)} ${F(26*s)}" ${ink(sw*.7)} stroke="#5C7A3E"/>`;
  }
  g+=mouth(cx,cy+hr*R(.36,.62),hr,sw);
  if(sp!=='alien'&&chance(.4))
    g+=`<path d="M${F(cx-hr*.5)} ${F(cy+hr*.35)} q${F(R(-6,6))} ${F(hr*.5)} ${F(R(-5,5))} ${F(hr*R(.7,1.3))}" ${ink(sw)} stroke="#4FA3D8"/>`;
  const by=cy+hr*R(1.0,1.3);
  g+=`<path d="M${F(cx+R(-8,8)*s)} ${F(cy+hr*.9)} L${F(cx+R(-14,14)*s)} ${F(by+70*s)}" ${ink(sw)}/>`;
  const acc=ACC;
  const dressed=acc==='trench'||acc==='jersey'||acc==='rocker';
  if(!dressed)for(let a=0;a<RI(1,3);a++){
    const dir=chance(.5)?-1:1,ex=cx+dir*R(42,90)*s,ey=by+R(-28,58)*s;
    g+=`<path d="M${F(cx)} ${F(by+R(2,20)*s)} Q${F(cx+dir*R(30,66)*s)} ${F(by+R(-32,26)*s)} ${F(ex)} ${F(ey)}" ${ink(sw)}/>`;
    for(let i=0;i<RI(2,7);i++){const an=R(-1.5,1.5);
      g+=`<path d="M${F(ex)} ${F(ey)} l${F(Math.cos(an)*R(9,24)*s*dir)} ${F(Math.sin(an)*R(9,24)*s)}" ${ink(sw)}/>`;}

const SUBJECTS=[
  [subjBrainlet,'brainlet',26],[subjCube,'block',13],[subjCactus,'cactus',11],
  [subjHand,'hand',11],[subjAnimal,'animal',13],[subjObject,'object',20],[subjAnime,'anime',6]
];
function pickSubject(){
  const tot=SUBJECTS.reduce((a,b)=>a+b[2],0);let r=R(0,tot);
  for(const e of SUBJECTS){if((r-=e[2])<=0)return e;}
  return SUBJECTS[0];
}

/* traits recorded as the piece is made */
let TR={};

function condition(w,h){
  let r=RNG();
  if(FORCE&&FORCE.condition)r={'craquelure':.7,'foxing':.85,'overpainted':.95,'water damage':.99}[FORCE.condition];
  let k,s='';
  if(r<.60){k='pristine';}
  else if(r<.80){
    k='craquelure';
    for(let i=0;i<Math.round(RI(30,70)*(w/300));i++)
      s+=`<path d="${scrawl(R(0,w),R(0,h),R(4,13),RI(2,4))}" fill="none" stroke="#2A1F14" stroke-width="${F(R(.4,1))}" opacity="${F(R(.25,.55))}"/>`;
  }else if(r<.92){
    k='foxing';
    for(let i=0;i<Math.round(RI(6,16)*(w/300));i++)
      s+=`<path d="${blob(R(0,w),R(0,h),R(4,15),7,4)}" fill="#7A5A33" opacity="${F(R(.16,.4))}"/>`;
  }else if(r<.98){
    k='overpainted';
    for(let i=0;i<RI(1,3);i++)
      s+=`<rect x="${F(R(0,w-70))}" y="${F(R(0,h-60))}" width="${F(R(40,110))}" height="${F(R(30,90))}" fill="${P(BG)}" opacity=".96" transform="rotate(${F(R(-6,6))} ${F(w/2)} ${F(h/2)})"/>`;
  }else{
    k='water damage';
    s+=`<path d="${blob(R(w*.2,w*.8),R(h*.6,h),R(70,120),10,26)}" fill="#6B4A28" opacity=".28"/>`;
    s+=`<path d="${blob(R(w*.2,w*.8),R(h*.66,h),R(45,80),9,20)}" fill="#4E3417" opacity=".2"/>`;
  }
  TR.condition=k;
  return s;
}

/* the world behind them. this is the part people will actually
   want to look at, so it is drawn straight. */
function scenery(W,H,small){
  let g='';const hz=H*R(.56,.74);
  const kind=P(['city','hills','desert','sea']);
  const far=P(PAL), near=P(PAL);
  if(chance(.7)){
    const r=R(14,30);
    g+=`<circle cx="${F(R(W*.15,W*.85))}" cy="${F(hz-R(40,120))}" r="${F(r)}" fill="${P(['#F2C511','#F5F0E4','#E2711D','#FF5EA8'])}" opacity="${F(R(.6,.95))}"/>`;
  }
  if(kind==='city'){
    for(let layer=0;layer<2;layer++){
      const c=layer?near:far, base=hz+layer*R(6,18), op=layer?1:.55;
      let x=-10;
      while(x<W+10){
        const bw=R(18,46), bh=R(30,120)*(layer?1:.8);
        g+=`<rect x="${F(x)}" y="${F(base-bh)}" width="${F(bw)}" height="${F(bh+40)}" fill="${c}" opacity="${op}" stroke="#111" stroke-width="1.1"/>`;
        if(layer)for(let r=0;r<Math.floor(bh/16);r++)for(let cc=0;cc<Math.floor(bw/13);cc++)
          if(chance(.4))g+=`<rect x="${F(x+5+cc*13)}" y="${F(base-bh+6+r*16)}" width="5" height="7" fill="#F2C511" opacity=".85"/>`;
        x+=bw+R(2,9);
      }
    }
  }else if(kind==='hills'){
    for(let layer=0;layer<3;layer++){
      const c=layer===2?near:far;
      let d=`M-10 ${F(H+10)} L-10 ${F(hz+layer*16)}`;
      for(let x=-10;x<W+20;x+=R(30,70))
        d+=` Q${F(x+20)} ${F(hz+layer*16-R(10,58))} ${F(x+50)} ${F(hz+layer*16-R(-8,20))}`;
      d+=` L${F(W+20)} ${F(H+10)} Z`;
      g+=`<path d="${d}" fill="${c}" opacity="${F(.4+layer*.24)}" stroke="#111" stroke-width="1.1"/>`;
    }
  }else if(kind==='desert'){
    g+=`<path d="M-10 ${F(H+10)} L-10 ${F(hz)} Q${F(W*.4)} ${F(hz-24)} ${F(W+20)} ${F(hz+10)} L${F(W+20)} ${F(H+10)} Z" fill="${P(['#D9A05B','#E0B87A','#C9964E'])}" stroke="#111" stroke-width="1.1"/>`;
    for(let i=0;i<RI(2,6);i++){
      const x=R(0,W),y=hz+R(0,26),h=R(20,48),col='#3E7B45';
      g+=`<rect x="${F(x)}" y="${F(y-h)}" width="8" height="${F(h)}" rx="4" fill="${col}" stroke="#111" stroke-width="1"/>`;
      if(chance(.6))g+=`<path d="M${F(x+4)} ${F(y-h*.55)} h${F(R(7,13))} v${F(-R(8,18))}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`;
    }
  }else{
    g+=`<rect x="-10" y="${F(hz)}" width="${F(W+20)}" height="${F(H-hz+20)}" fill="${P(['#25A7B0','#3F52C4','#4FA3D8'])}" opacity=".85"/>`;
    for(let i=0;i<RI(5,14);i++)
      g+=`<path d="M${F(R(0,W))} ${F(hz+R(6,H-hz))} q8 -5 18 0" fill="none" stroke="#F5F0E4" stroke-width="1.6" opacity=".7"/>`;
  }
  if(small)for(let i=0;i<RI(1,4);i++){
    const e=pickSubject();
    g+=`<g opacity="${F(R(.75,1))}">${e[0](R(W*.12,W*.88),hz-R(-6,14),R(.16,.3))}</g>`;
  }
  return g;
}

function generate(){
  const w=CW,h=CH;let s='';
  TR={};
  const dark=(FORCE&&FORCE.ground==='nocturne')?true:chance(.16);
  const gid='g'+Math.floor(RNG()*1e6);
  const COMPW=[['center',.15],['scatter',.12],['diptych',.11],['tiny',.10],
               ['crowd',.12],['portrait',.16],['landscape',.24]];
  let mode=(()=>{let r=R(0,1);for(const[k,w]of COMPW){if((r-=w)<=0)return k;}return 'center';})();
  if(FORCE&&FORCE.composition)mode=FORCE.composition;
  if(BANNER&&!(FORCE&&FORCE.composition))mode=chance(.75)?'landscape':mode;
  TR.composition=mode;
  SPECIES=null;
  ACC=pickAcc();

  /* ground */
  const style=RI(0,3);
  TR.ground=dark?'nocturne':['gradient','aureole','colour field','flat'][style];
  if(style===0){
    const c1=P(PAL),c2=dark?'#1A1A22':P(BG);
    s+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="${F(R(0,1))}" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${gid})"/>`;
  }else if(style===1){
    s+=`<defs><radialGradient id="${gid}"><stop offset="0" stop-color="${P(PAL)}"/><stop offset="1" stop-color="${dark?'#1A1A22':P(BG)}"/></radialGradient></defs><rect width="${w}" height="${h}" fill="url(#${gid})"/>`;
  }else if(style===2){
    s+=`<rect width="${w}" height="${h}" fill="${dark?'#1A1A22':P(BG)}"/>`;
    s+=`<rect width="${w}" height="${F(R(80,200))}" y="${F(R(0,120))}" fill="${P(PAL)}" opacity="${F(R(.4,.9))}"/>`;
  }else{
    s+=`<rect width="${w}" height="${h}" fill="${dark?'#2B1F3A':P(BG)}"/>`;
  }

  /* colour that actually lands */
  const blobs=Math.max(2,Math.round(RI(3,9)*DENS));
  TR.palette=blobs>=7?'saturated':blobs>=5?'mixed':'restrained';
  for(let i=0;i<blobs;i++){
    const c=P(PAL),x=R(0,w),y=R(0,h),r=R(10,64);
    s+=`<path d="${blob(x,y,r,RI(6,10),r*.4)}" fill="${c}" opacity="${F(R(.45,.95))}"/>`;
    for(let d=0;d<RI(0,3);d++)s+=drip(x+R(-r,r),y+r*.7,R(20,90),c,R(2,7));
  }
  for(let i=0;i<Math.round(RI(4,16)*DENS*(w/300));i++)
    s+=`<circle cx="${F(R(0,w))}" cy="${F(R(0,h))}" r="${F(R(1.5,9))}" fill="${P(PAL)}" opacity="${F(R(.5,1))}"/>`;
  for(let i=0;i<RI(0,3);i++)
    s+=`<rect x="${F(R(-20,w))}" y="${F(R(-20,h))}" width="${F(R(24,150))}" height="${F(R(12,130))}" fill="${P(PAL)}" opacity="${F(R(.25,.7))}" transform="rotate(${F(R(-45,45))} ${F(R(0,w))} ${F(R(0,h))})"/>`;
  for(let i=0;i<Math.round(RI(1,5)*(w/300));i++)
    s+=`<path d="${scrawl(R(20,w-20),R(20,h-20),R(20,58),RI(3,10))}" fill="none" stroke="${chance(.45)?'#111':P(PAL)}" stroke-width="${F(R(1.6,8))}" stroke-linecap="round" opacity="${F(R(.6,1))}"/>`;

  /* subjects */
  let picks=[];
  const AN=(FORCE&&FORCE.anchor)?FORCE.anchor:null;
  const fx=w/300, fy=h/300;
  if(mode==='landscape'){
    s+=scenery(w,h,true);
    picks=[];
  }else if(mode==='portrait'){
    /* the sitter, three-quarter, with a view behind them */
    s+=`<g opacity=".85">${scenery(w,h,false)}</g>`;
    picks=[[w*.5+R(-14,14)*fx, h*R(.52,.6), R(1.15,1.5)*Math.min(fx,fy)]];
  }
  else if(mode==='center')picks=[[AN?AN[0]*fx:w*.5,AN?AN[1]*fy:h*.5,R(.95,1.25)*Math.min(fx,fy)]];
  else if(mode==='tiny')picks=[[R(w*.3,w*.7),R(h*.3,h*.7),R(.28,.45)]];
  else if(mode==='diptych')picks=[[R(w*.2,w*.34),R(h*.4,h*.57),R(.55,.8)],[R(w*.66,w*.8),R(h*.4,h*.57),R(.55,.8)]];
  else if(mode==='crowd')picks=[...Array(RI(3,5)+(BANNER?2:0))].map(()=>[R(w*.08,w*.92),R(h*.2,h*.63),R(.34,.6)]);
  else picks=[...Array(RI(2,3)+(BANNER?1:0))].map(()=>[R(w*.1,w*.9),R(h*.23,h*.6),R(.5,.85)]);

  HANDS=0;
  const names=[];
  const forced=FORCE&&FORCE.subject?SUBJECTS.find(e=>e[1]===FORCE.subject):null;
  picks.forEach((p,ix)=>{const e=(forced&&ix===0)?forced:pickSubject();names.push(e[1]);s+=e[0](p[0],p[1],p[2]);});
  TR.subject=names.length?[...new Set(names)].sort().join(' + '):'scenery';
  TR.figures=String(picks.length);
  TR.species=SPECIES||'\u2014';
  TR.accessory=ACC||'none';
  TR.hands=HANDS?String(HANDS):'—';

  /* doodles in the margins, because someone always draws on it */
  const DOOD=['star','spiral','heart','arrow','smiley','x','cloud'];
  for(let i=0;i<RI(0,Math.round(3*DENS));i++){
    const k=P(DOOD),x=R(14,w-14),y=R(14,h-14),z=R(.55,1.5),c=chance(.55)?'#111':P(PAL);
    const st=`fill="none" stroke="${c}" stroke-width="${F(R(1.4,3.2))}" stroke-linecap="round" stroke-linejoin="round" opacity="${F(R(.6,1))}"`;
    if(k==='star'){let d='';for(let p=0;p<5;p++){const a=-Math.PI/2+p*4*Math.PI/5;d+=(p?'L':'M')+F(x+Math.cos(a)*13*z)+' '+F(y+Math.sin(a)*13*z);}s+=`<path d="${d}Z" ${st}/>`;}
    else if(k==='spiral'){let d=`M${F(x)} ${F(y)}`;for(let p=1;p<26;p++){const a=p*.55,r=p*.9*z;d+=`L${F(x+Math.cos(a)*r)} ${F(y+Math.sin(a)*r)}`;}s+=`<path d="${d}" ${st}/>`;}
    else if(k==='heart'){s+=`<path d="M${F(x)} ${F(y+9*z)} q${F(-13*z)} ${F(-10*z)} ${F(-6*z)} ${F(-17*z)} q${F(6*z)} ${F(-6*z)} ${F(6*z)} ${F(2*z)} q0 ${F(-8*z)} ${F(6*z)} ${F(-2*z)} q${F(7*z)} ${F(7*z)} ${F(-6*z)} ${F(17*z)} Z" ${st}/>`;}
    else if(k==='arrow'){const a=R(0,6.28);s+=`<path d="M${F(x)} ${F(y)} l${F(Math.cos(a)*26*z)} ${F(Math.sin(a)*26*z)} m0 0 l${F(-Math.cos(a-.6)*10*z)} ${F(-Math.sin(a-.6)*10*z)} m${F(Math.cos(a-.6)*10*z)} ${F(Math.sin(a-.6)*10*z)} l${F(-Math.cos(a+.6)*10*z)} ${F(-Math.sin(a+.6)*10*z)}" ${st}/>`;}
    else if(k==='smiley'){s+=`<circle cx="${F(x)}" cy="${F(y)}" r="${F(13*z)}" ${st}/><circle cx="${F(x-4.5*z)}" cy="${F(y-4*z)}" r="${F(1.6*z)}" fill="${c}"/><circle cx="${F(x+4.5*z)}" cy="${F(y-4*z)}" r="${F(1.6*z)}" fill="${c}"/><path d="M${F(x-6*z)} ${F(y+4*z)} q${F(6*z)} ${F(6*z)} ${F(12*z)} 0" ${st}/>`;}
    else if(k==='x'){s+=`<path d="M${F(x-10*z)} ${F(y-10*z)} l${F(20*z)} ${F(20*z)} M${F(x+10*z)} ${F(y-10*z)} l${F(-20*z)} ${F(20*z)}" ${st}/>`;}
    else{s+=`<path d="M${F(x-16*z)} ${F(y)} q${F(2*z)} ${F(-12*z)} ${F(12*z)} ${F(-8*z)} q${F(6*z)} ${F(-9*z)} ${F(15*z)} ${F(1*z)} q${F(9*z)} ${F(1*z)} ${F(5*z)} ${F(7*z)} Z" ${st}/>`;}
  }

  /* the tells */
  if(chance(.34)){
    const t=P(GIBBER);TR.inscription=t;
    s+=`<text x="${F(R(20,w-110))}" y="${F(R(40,h-20))}" font-family="Georgia,serif" font-size="${F(R(15,38))}" fill="${chance(.5)?'#111':P(PAL)}" opacity="${F(R(.5,.95))}" transform="rotate(${F(R(-14,14))} ${F(w/2)} ${F(h/2)})" letter-spacing="${F(R(-1,4))}">${t}</text>`;
  }else TR.inscription='none';

  const sg=RNG();
  if(sg<.42){TR.signature='signed';}
  else if(sg<.52){TR.signature='signed and dated';}
  else TR.signature='unsigned';
  if(TR.signature!=='unsigned')
    s+=`<path d="${scrawl(R(w-100,w-45),R(h-45,h-15),R(8,16),RI(4,8))}" fill="none" stroke="#111" stroke-width="${F(R(1.2,2.6))}" stroke-linecap="round" opacity=".8"/>`;
  if(TR.signature==='signed and dated')
    s+=`<text x="${F(R(w-104,w-68))}" y="${F(h-4)}" font-family="Georgia,serif" font-size="11" fill="#111" opacity=".7">'${RI(61,99)}</text>`;

  if(chance(.18))
    s+=`<rect width="${w}" height="${h}" fill="${P(PAL)}" opacity="${F(R(.08,.2))}"/>`;

  if(mode==='portrait'){
    const vid='v'+Math.floor(RNG()*1e6);
    s+=`<defs><radialGradient id="${vid}"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".62"/></radialGradient></defs>`;
    s+=`<rect width="${w}" height="${h}" fill="url(#${vid})"/>`;
    if(chance(.35))
      s+=`<ellipse cx="${F(w/2)}" cy="${F(h*.5)}" rx="${F(w*.42)}" ry="${F(h*.46)}" fill="none" stroke="#C9A227" stroke-width="${F(R(3,7))}" opacity=".75"/>`;
  }
  s+=condition(w,h);

  const el=document.getElementById('art');
  el.setAttribute('viewBox','0 0 '+w+' '+h);
  el.innerHTML=s;
}

/* ============ rarity ============ */
/* every trait carries its own odds; the score is the sum of their
   inverses, which is how the rest of the market does it too. */
const ODDS={
  subject:{brainlet:.26,object:.20,block:.13,animal:.13,cactus:.11,hand:.11,anime:.06},
  composition:{center:.15,scatter:.12,diptych:.11,tiny:.10,crowd:.12,portrait:.16,landscape:.24},
  ground:{gradient:.21,aureole:.21,'colour field':.21,flat:.21,nocturne:.16},
  condition:{pristine:.60,craquelure:.20,foxing:.12,overpainted:.06,'water damage':.02},
  signature:{unsigned:.48,signed:.42,'signed and dated':.10},
  inscription:{none:.66},
  palette:{restrained:.29,mixed:.28,saturated:.43},
  figures:{'0':.24,'1':.31,'2':.18,'3':.18,'4':.045,'5':.045},
  hands:{'—':.80},
  species:{'—':.40,human:.16,generic:.035,chicken:.035,bird:.035,long:.035,horned:.035,
           bunny:.035,mouse:.035,tiger:.035,monkey:.035,worm:.035,
           goat:.012,bull:.014,zombie:.011,alien:.012},
  accessory:{none:.40,glasses:.12,sunglasses:.09,cap:.09,trench:.06,beanie:.05,jersey:.05,
             beret:.04,rocker:.04,monocle:.02,cigarette:.025,cigar:.015,crown:.01}
};
function oddsOf(k,v){
  const t=ODDS[k]; if(!t) return .5;
  if(t[v]!==undefined) return t[v];
  if(k==='subject'){ // combinations are rarer than any single subject
    return v.split(' + ').reduce((a,n)=>a*(ODDS.subject[n]||.1),1);
  }
  if(k==='inscription') return .34/12;
  if(k==='hands') return .20/8;
  return .05;
}
const TIERS=[
  {en:'Study collection',   es:'Colecci\u00f3n de estudio',        t:1},
  {en:'General display',    es:'Exhibici\u00f3n general',          t:2},
  {en:'Permanent collection',es:'Colecci\u00f3n permanente',       t:3},
  {en:'On loan, private lender',es:'En pr\u00e9stamo, prestamista privado',t:4},
  {en:'Disputed attribution',es:'Atribuci\u00f3n disputada',       t:5},
  {en:'The Vault',          es:'La B\u00f3veda',                   t:6}
];
const CUTS=[0,79,123,231,847,4541];
function rarity(){
  let score=0, rows=[];
  ['subject','species','accessory','figures','hands','composition','ground','palette','inscription','signature','condition'].forEach(k=>{
    if(TR[k]===undefined) return;
    const p=oddsOf(k,TR[k]);
    score+=1/p;
    rows.push([k,TR[k],p]);
  });
  let ti=0;
  for(let i=CUTS.length-1;i>=0;i--){ if(score>=CUTS[i]){ti=i;break;} }
  return {score,tier:TIERS[ti],rows};
}

const FIRST=['Anneke','Bruno','Cosima','Dieter','Elke','Fabien','Greta','Henning','Ines','Joris','Katrien','Lars','Margit','Nils','Otto','Pia','Rutger','Sanne','Thijs','Ulrike','Vera','Wim','Yara','Zoltan','Mireia','Sol','Ren\u00e9'];
const LAST=['Vandenhaus','Brekker','Oostrum','Halvard','Maeterlin','Ronsdorf','Kjelling','Vermeulen','Sattler','Duvivier','Nachtwey','Oberkamp','Stroeve','Leclos','Brandhof','Wintermans','Aguirre-B\u00f6hm','Delvaux'];
const MONO=['SERRA \u2020','VOSS','K.','HOLM','NN','ORTA','B\u00c4R','LUM'];

let cur={}, acquired=false, lang='en';

function newWork(text){
  if(text&&text.trim()){
    /* the words steer. the roll is new every time, so no two
       visitors ever leave with the same cat. */
    const variant=Math.floor(Math.random()*4294967296);
    SEED=(hash(norm(text))^variant)>>>0;
    RNG=mulberry32(SEED); FORCE=readWords(text); cur.src=text.trim();
  }else if(text&&text.seedOnly){
    SEED=text.seedOnly; RNG=mulberry32(SEED); FORCE=text.force||null; cur.src=text.label||null;
  }else{
    SEED=Math.floor(Math.random()*4294967296); RNG=mulberry32(SEED); FORCE=null; cur.src=null;
  }
  PAL=(FORCE&&FORCE.pal)?FORCE.pal:BAD;
  WOB=(FORCE&&FORCE.wob)?FORCE.wob:1;
  DENS=(FORCE&&FORCE.dens)?FORCE.dens:1;
  const seedA=RI(0,5), seedB=RI(0,13), num=RI(2,97);
  cur={
    a:seedA,b:seedB,num:num,
    artist: chance(.16)?P(MONO):`${P(FIRST)} ${P(LAST)}`,
    year: RI(1961,2027),
    m1:RI(0,13), m2:RI(0,13), m3:RI(0,13), sf:RI(0,6),
    dim:`${RI(18,320)} \u00d7 ${(R(3,240)).toFixed(1)} cm`,
    st1:RI(0,5), st2:RI(0,5),
    src:cur.src||null, seed:SEED, force:FORCE
  };
  cur.rar=null;
  acquired=false;
  generate();
  cur.rar=rarity();
  const band=[[180,900],[900,2400],[2400,6000],[6000,14000],[14000,40000],[40000,120000]][cur.rar.tier.t-1];
  cur.val=RI(band[0],band[1])*1000+RI(1,9)*100;
  render();
}

function render(){
  const d=D[lang], p=document.getElementById('placard');
  const a=d.tA[cur.a], b=d.tB[cur.b];
  const title = a==='untitled'||a==='sin t\u00edtulo' ? `${a} (n.\u00ba ${cur.num})` : `${a} ${b}`;

  document.querySelector('[data-i="sub"]').textContent=d.sub;
  document.getElementById('pArtist').textContent=cur.artist;
  document.getElementById('pTitle').textContent=title;
  const credit=cur.src?`<br><span style="opacity:.8">${cur.src==='__photo__'?d.fromPhoto:d.after}</span>`:'';
  document.getElementById('pMeta').innerHTML=
    `${cur.year}<br>${d.med[cur.m1]}, ${d.med[cur.m2]} ${lang==='en'?'and':'y'} ${d.med[cur.m3]} ${lang==='en'?'on':'sobre'} ${d.surf[cur.sf]}<br>${cur.dim}${credit}`;
  document.getElementById('pStmt').textContent=`${d.s1[cur.st1]} ${d.s2[cur.st2]}`;
  document.getElementById('pVal').textContent='$'+cur.val.toLocaleString('en-US')+' USD';

  const rar=cur.rar, t=rar.tier.t;
  document.getElementById('pTier').textContent=rar.tier[lang]+'  ·  '+d.unacc;
  document.getElementById('frame').className='frame t'+t;
  document.getElementById('wall').classList.toggle('lit',t>=5);
  document.getElementById('rope').classList.toggle('hide',t<6);
  document.getElementById('fileH').textContent=d.fileH;

  const tr=v=>d.val&&d.val[v]?d.val[v]:v;
  document.getElementById('rows').innerHTML=rar.rows.map(([k,v,p])=>{
    const shown=k==='subject'?v.split(' + ').map(tr).join(' + '):tr(v);
    const pct=p<.01?(p*100).toFixed(2):(p*100).toFixed(0);
    const key=p<=.06?' key':'';
    return `<div class="row${key}"><b>${d.lab[k]}</b><i>${shown}</i><u>${pct}%</u></div>`;
  }).join('');
  document.getElementById('pStatus').textContent=acquired?d.got:d.held;
  p.classList.toggle('acquired',acquired);

  const buy=document.getElementById('buy');
  buy.textContent=d.buy; buy.disabled=acquired;
  document.getElementById('next').textContent=d.next;
  document.getElementById('note').textContent=d.note;
  document.getElementById('deskH').textContent=d.deskH;
  document.getElementById('deskP').textContent=d.deskP;
  document.getElementById('deskGo').textContent=d.deskGo;
  document.getElementById('camGo').textContent=d.camGo;
  document.getElementById('modeG').textContent=d.modeG;
  document.getElementById('modeB').textContent=d.modeB;
  document.getElementById('saveBtn').textContent=d.save;
  document.getElementById('modeG').style.opacity=BANNER?'.45':'1';
  document.getElementById('modeB').style.opacity=BANNER?'1':'.45';
  document.getElementById('tagline').textContent=d.camNote+'   #Slouvred';
  document.getElementById('seedline').textContent=
    (cur.seed===null||cur.seed===undefined)?'' :
    (cur.src==='__photo__'?`${d.seeded} ${cur.seed}`:`\u201c${cur.src}\u201d \u00b7 ${d.seeded} ${cur.seed}`);
  document.getElementById('cRole').textContent=d.role;
  document.getElementById('cQuote').textContent=P(d.quotes);
  document.getElementById('fLeft').textContent=d.foot;

  const names=[];
  for(let i=0;i<14;i++) names.push(`${P(FIRST)} ${P(LAST)}`);
  const row=names.map(n=>`<span>${n}</span>`).join('');
  document.getElementById('donors').innerHTML=row+row;
}

/* ---- the portrait service ----
   the photograph is read into a 48x48 grid in the browser, turned into
   numbers, and thrown away. it never leaves the device. */
/* stamped on saved images only. the gallery itself stays unstamped,
   the way a museum does not sign other people's canvases. */
const MARK='$SLOUVRE · theslouvre.com';
function setMode(b){ if(BANNER===b)return; BANNER=b; CW=b?900:300; CH=300; rerender(); }
function rerender(){
  if(cur.seed===null||cur.seed===undefined){newWork();return;}
  newWork({seedOnly:cur.seed,force:cur.force||null,label:cur.src});
}
document.getElementById('modeG').onclick=()=>setMode(false);
document.getElementById('modeB').onclick=()=>setMode(true);
document.getElementById('saveBtn').onclick=()=>{
  const svg=document.getElementById('art').cloneNode(true);
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.setAttribute('width',CW);svg.setAttribute('height',CH);
  const ns='http://www.w3.org/2000/svg';
  const plate=document.createElementNS(ns,'rect');
  const tw=MARK.length*5.6+14;
  plate.setAttribute('x',CW-tw-8);plate.setAttribute('y',CH-20);
  plate.setAttribute('width',tw);plate.setAttribute('height',13);
  plate.setAttribute('fill','#FBFAF7');plate.setAttribute('opacity','.82');
  svg.appendChild(plate);
  const t=document.createElementNS(ns,'text');
  t.setAttribute('x',CW-tw-1);t.setAttribute('y',CH-10.5);
  t.setAttribute('font-family','Georgia,serif');
  t.setAttribute('font-size','9.5');
  t.setAttribute('letter-spacing','.9');
  t.setAttribute('fill','#111');
  t.textContent=MARK;
  svg.appendChild(t);
  const str=new XMLSerializer().serializeToString(svg);
  const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml;charset=utf-8'}));
  const im=new Image();
  im.onload=()=>{
    const k=3,c=document.createElement('canvas');
    c.width=CW*k;c.height=CH*k;
    const x=c.getContext('2d');
    x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
    x.drawImage(im,0,0,c.width,c.height);
    c.toBlob(bl=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(bl);
      a.download='slouvre-'+(cur.seed||Date.now())+(BANNER?'-banner':'')+'.png';
      document.body.appendChild(a);a.click();a.remove();
    });
    URL.revokeObjectURL(url);
  };
  im.src=url;
};
document.getElementById('camGo').onclick=()=>document.getElementById('camIn').click();
document.getElementById('camIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    try{ fromPhoto(img); }catch(err){}
    URL.revokeObjectURL(url);
    e.target.value='';
  };
  img.onerror=()=>{URL.revokeObjectURL(url);e.target.value='';};
  img.src=url;
});
function sat(r,g,b){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  if(mx===mn)return `rgb(${r|0},${g|0},${b|0})`;
  const k=1.9;
  const push=v=>Math.max(0,Math.min(255,l+(v-l)*k));
  return `rgb(${push(r)|0},${push(g)|0},${push(b)|0})`;
}
function fromPhoto(img){
  const N=48,c=document.createElement('canvas');
  c.width=N;c.height=N;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data;
  const buck={};let lum=0,mx=0,my=0,w=0,edge=0,prev=0,hsh=2166136261;
  for(let i=0;i<N*N;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    const L=r*.299+g*.587+b*.114;
    lum+=L;
    const key=[Math.round(r/42),Math.round(g/42),Math.round(b/42)].join(',');
    buck[key]=(buck[key]||0)+1;
    const px=i%N,py=(i/N)|0;
    mx+=px*L;my+=py*L;w+=L;
    if(px>0&&Math.abs(L-prev)>26)edge++;
    prev=L;
    hsh^=(r<<16|g<<8|b);hsh=Math.imul(hsh,16777619);
  }
  const avg=lum/(N*N);
  const pal=Object.entries(buck).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([k])=>{const p=k.split(',').map(Number);return sat(p[0]*42,p[1]*42,p[2]*42);});
  const cxp=(mx/w)/N, cyp=(my/w)/N;
  const busy=edge/(N*N);
  const force={
    pal:pal.length>=3?pal:BAD,
    ground:avg<86?'nocturne':(busy>.12?'gradient':'aureole'),
    composition:busy>.17?'crowd':(busy<.05?'tiny':'center'),
    subject:P(['brainlet','brainlet','brainlet','animal','block','hand','object']),
    wob:.7+busy*7,
    dens:.7+busy*4.5,
    anchor:[40+cxp*220,50+cyp*180]
  };
  if(avg>212)force.condition='overpainted';
  if(avg<48)force.condition='foxing';
  const seed=((hsh>>>0)^Math.floor(Math.random()*4294967296))>>>0;
  newWork({seedOnly:seed,force:force,label:'__photo__'});
}

document.getElementById('deskIn').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value;if(v.trim())newWork(v);}
});
document.getElementById('buy').onclick=()=>{acquired=true;render();};
document.getElementById('en').onclick=()=>{lang='en';setLang();};
document.getElementById('es').onclick=()=>{lang='es';setLang();};
function setLang(){
  document.getElementById('en').setAttribute('aria-pressed',lang==='en');
  document.getElementById('es').setAttribute('aria-pressed',lang==='es');
  render();
}
newWork();
</script>

<script>
/* ================= the entrance ================= */
(function(){
const intro=document.getElementById('intro');
const beatEl=document.getElementById('beat');
const vigEl=document.getElementById('vig');
const tapEl=document.getElementById('tapHint');
const skipEl=document.getElementById('iSkip');
const soundBtn=document.getElementById('sound');

/* ---- the loafers ---- */
const S='stroke="#EDE4D2" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
function loafer(x,flip,tilt){
  const d=flip?-1:1;
  return `<g transform="translate(${x} 0) scale(${d} 1) rotate(${tilt||0} 0 60)" ${S}>
    <ellipse cx="0" cy="18" rx="11" ry="13"/>
    <path d="M-9 12c4-6 14-6 18 0"/>
    <path d="M-5 17h3M3 17h3" stroke-width="3.2"/>
    <path d="M-2 24c2 2 5 2 7 0"/>
    <path d="M0 31v10"/>
    <path d="M-14 44c4-4 24-4 28 0 3 3 4 16 3 26h-34c-1-10 0-23 3-26z"/>
    <path d="M-14 52c-8 6-10 14-4 18 5 3 12 1 16-2"/>
    <path d="M14 52c8 6 10 14 4 18-5 3-12 1-16-2"/>
    <path d="M-7 70v22M7 70v22"/>
    <ellipse cx="-10" cy="97" rx="13" ry="5.5"/>
    <ellipse cx="10" cy="97" rx="13" ry="5.5"/>
    <path d="M-14 95h8M6 95h8"/>
  </g>`;
}
const VIGS={
  nodding:`<svg viewBox="0 0 260 110">
    <rect x="8" y="12" width="62" height="76" ${S}/>
    <rect x="16" y="20" width="46" height="60" stroke="#EDE4D2" stroke-width="1.2" fill="none" opacity=".45"/>
    ${loafer(115,false,0)}${loafer(163,false,-3)}${loafer(211,true,2)}
  </svg>`,
  banana:`<svg viewBox="0 0 240 110">
    <rect x="150" y="8" width="82" height="86" ${S}/>
    <path d="M172 44 Q186 70 208 54 Q192 66 176 50 Z" ${S}/>
    <path d="M172 44l-5-7" stroke="#EDE4D2" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="178" y="32" width="22" height="9" ${S} opacity=".7"/>
    ${loafer(60,false,0)}
    <g ${S}><rect x="72" y="30" width="20" height="14" rx="2"/><circle cx="82" cy="37" r="4"/></g>
  </svg>`,
  silence:`<svg viewBox="0 0 220 110">
    ${loafer(40,false,-4)}${loafer(96,false,3)}${loafer(152,true,-2)}
    <g ${S} opacity=".55">
      <ellipse cx="40" cy="6" rx="15" ry="8"/><path d="M34 6h12"/>
      <ellipse cx="152" cy="4" rx="15" ry="8"/><path d="M146 4h12"/>
    </g>
  </svg>`
};

/* ---- the script ---- */
const BEATS={en:[
  ['You are early. The museum does not open for eleven minutes. Come in anyway.',null],
  ['For thirty years I watched men in soft leather shoes stand before a canvas and say nothing, for a very long time, on purpose.','nodding'],
  ['They did not understand it either. They had only learned that silence looks like understanding.','silence'],
  ['One of them paid four million dollars for a banana. He did not eat it. That, I think, was his mistake.','banana'],
  ['So I built this. Everything here is bad. Genuinely, thoroughly bad.',null],
  ['And it is hung, and lit, and labelled, and insured \u2014 because that is all a masterpiece has ever been.',null],
  ['Look at it properly. It cost no one anything, and it is yours to judge.',null],
  ['The doors are open. Mind the rope.',null]
],es:[
  ['Lleg\u00f3 temprano. El museo no abre hasta dentro de once minutos. Pase de todos modos.',null],
  ['Durante treinta a\u00f1os vi a hombres de zapatos suaves pararse ante un lienzo y no decir nada, mucho rato, a prop\u00f3sito.','nodding'],
  ['Ellos tampoco la entend\u00edan. Solo hab\u00edan aprendido que el silencio parece entendimiento.','silence'],
  ['Uno pag\u00f3 cuatro millones de d\u00f3lares por un pl\u00e1tano. No se lo comi\u00f3. Ese, creo yo, fue su error.','banana'],
  ['As\u00ed que constru\u00ed esto. Todo aqu\u00ed es malo. Genuina y completamente malo.',null],
  ['Y est\u00e1 colgado, iluminado, etiquetado y asegurado \u2014 porque eso es todo lo que una obra maestra ha sido siempre.',null],
  ['M\u00edrela bien. No le cost\u00f3 nada a nadie, y es suya para juzgarla.',null],
  ['Las puertas est\u00e1n abiertas. Cuidado con el cord\u00f3n.',null]
]};
const UI={en:{skip:'Skip',tap:'tap to continue'},es:{skip:'Saltar',tap:'toque para continuar'}};

let iLang='en', i=-1, timer=null, done=false;
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- the score: four bars, no samples ---- */
let AC=null,master=null,filt=null,musicOn=true,barTimer=null;
const CH=[[110,261.63,329.63,392],[174.61,261.63,349.23,440],[130.81,246.94,329.63,392],[98,246.94,293.66,392]];
let bar=0;
function startAudio(){
  if(AC||!musicOn)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1500;
    master=AC.createGain();master.gain.value=0;
    filt.connect(master);master.connect(AC.destination);
    master.gain.linearRampToValueAtTime(.075,AC.currentTime+3);
    playBar();barTimer=setInterval(playBar,3600);
  }catch(e){}
}
function tone(f,at,dur,vel){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(vel,at+.012);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g);g.connect(filt);o.start(at);o.stop(at+dur+.1);
}
function playBar(){
  if(!AC)return;
  const t=AC.currentTime+.05,c=CH[bar%CH.length];
  tone(c[0],t,3.4,.20);
  tone(c[1],t+.45,2.8,.13);
  tone(c[2],t+.95,2.5,.11);
  if(Math.random()<.7)tone(c[3],t+1.6,2.2,.085);
  bar++;
}
soundBtn.onclick=()=>{
  musicOn=!musicOn;
  soundBtn.textContent=musicOn?'\u266a':'\u266a\u0338';
  if(!AC&&musicOn){startAudio();return;}
  if(master)master.gain.linearRampToValueAtTime(musicOn?.055:0,AC.currentTime+.5);
};

/* ---- beats ---- */
function show(n){
  const list=BEATS[iLang];
  if(n>=list.length){enter();return;}
  i=n;
  const [txt,vig]=list[n];
  beatEl.classList.remove('on');vigEl.classList.remove('on');
  const paint=()=>{
    beatEl.textContent=txt;
    vigEl.innerHTML=vig?VIGS[vig]:'';
    beatEl.classList.add('on');if(vig)vigEl.classList.add('on');
  };
  reduce?paint():setTimeout(paint,340);
  clearTimeout(timer);
  timer=setTimeout(()=>show(n+1), n===0?4200:(txt.length>110?6200:5000));
}
function advance(){ if(done)return; clearTimeout(timer); show(i+1); }
function enter(){
  if(done)return;done=true;
  clearTimeout(timer);
  intro.classList.remove('shut');intro.classList.add('opening');
  if(master&&AC)master.gain.linearRampToValueAtTime(musicOn?.055:0,AC.currentTime+2);
  soundBtn.classList.add('show');
  setTimeout(()=>intro.classList.add('gone'), reduce?60:2200);
}
intro.addEventListener('click',e=>{
  if(e.target.closest('.ictl'))return;
  startAudio();advance();
});
skipEl.onclick=()=>{startAudio();enter();};

function setIntroLang(l){
  iLang=l;
  document.getElementById('iEn').setAttribute('aria-pressed',l==='en');
  document.getElementById('iEs').setAttribute('aria-pressed',l==='es');
  skipEl.textContent=UI[l].skip;tapEl.textContent=UI[l].tap;
  document.getElementById(l).click();
  if(i>=0){const cur=i;i=-1;show(cur);}
}
document.getElementById('iEn').onclick=e=>{e.stopPropagation();startAudio();setIntroLang('en');};
document.getElementById('iEs').onclick=e=>{e.stopPropagation();startAudio();setIntroLang('es');};

skipEl.textContent=UI.en.skip;tapEl.textContent=UI.en.tap;
setTimeout(()=>show(0),700);
})();
</script>
